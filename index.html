<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عادل لطفي</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f0f0f0}
.header{background:#075E54;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.box{background:#fff;margin:15px;padding:15px;border-radius:12px}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px;font-size:17px}
button{width:100%;padding:14px;border:none;border-radius:25px;font-size:18px;font-weight:bold;cursor:pointer}
.calc{background:#25D366;color:#fff}
.share{background:#075E54;color:#fff;margin-top:10px}
#result{display:none;background:#DCF8C6;padding:15px;border-radius:10px;margin-top:10px;font-size:19px;line-height:1.8}
</style>
</head>
<body>
<div class="header">برنامج عادل لطفي</div>
<div class="box">
<input id="name" placeholder="الاسم">
<input id="num" type="number" placeholder="رقم">
<button class="calc" onclick="calc()">احسب</button>
<div id="result"></div>
<button class="share" onclick="share()">مشاركة البرنامج</button>
</div>
<script>
function calc(){
let n=document.getElementById('name').value;
let v=document.getElementById('num').value;
if(!n||!v){alert('اكتب الاسم والرقم الأول');return}
document.getElementById('result').style.display='block';
document.getElementById('result').innerHTML='الاسم: '+n+'<br>الرقم: '+v+'<br>النتيجة: '+(v*1)+' ✅';
}
function share(){
let link='https://adelbuk1975-eng.github.io';
if(navigator.share){navigator.share({title:'عادل لطفي',text:'جرب برنامج عادل لطفي',url:link})}
else{prompt('انسخ اللينك:',link)}
}
</script>
</body>
</html>
